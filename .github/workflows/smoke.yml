name: Android 17 smoke

# Live smoke on an Android 17 emulator against production (#325): sign in with the dedicated
# smoke account, /bikes, a bike, /me, sign out. Also runs the Keystore instrumented tests.
# Without the COLABIKE_SMOKE_EMAIL / COLABIKE_SMOKE_PASSWORD secrets the live test is skipped
# and says so; it never passes on fake data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMOKE_EMAIL: ${{ secrets.COLABIKE_SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.COLABIKE_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke credentials
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::notice title=Live smoke skipped::COLABIKE_SMOKE_EMAIL / COLABIKE_SMOKE_PASSWORD are not set; only the Keystore tests run."
          fi
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:auth:assembleDebugAndroidTest
      - name: Start the Android 17 emulator
        run: scripts/emulator.sh start
      - name: Instrumented tests
        run: |
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.smokeEmail="$SMOKE_EMAIL" \
            -Pandroid.testInstrumentationRunnerArguments.smokePassword="$SMOKE_PASSWORD"
      - name: Stop the emulator
        if: always()
        run: scripts/emulator.sh stop
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
