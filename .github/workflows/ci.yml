name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (format, contract, lint, unit + screenshot tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The same single command as AGENTS.md: nothing in CI that a contributor cannot run.
      - run: ./gradlew verify
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: colabike-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          retention-days: 7

  release:
    name: release (R8, 16 KB native libraries, mapping)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # R8 and resource shrinking run only here, not in `verify`: a release that does not build, or
      # that carries a library not ready for 16 KB pages, is found on the pull request.
      - run: ./gradlew :app:assembleRelease
      - run: scripts/check-native-alignment.sh app/build/outputs/apk/release/app-release-unsigned.apk
      # The mapping reads a stack trace of this build back into the source. The repository is
      # public, so artifacts are readable by anyone signed in to GitHub: that is fine for the
      # mapping of an unsigned build of open source, and not a place for the mapping of a signed
      # release candidate (docs/install.md).
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: colabike-release-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
